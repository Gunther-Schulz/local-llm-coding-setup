# Loaded when ACTIVE_MODEL=bge-m3 (in config/server.env). Same name as this file.
# BGE-M3 embedding (BAAI), FP16 ~1.2 GB. Max sequence 8192 tokens; dense + sparse + multi-vector. For vector/semantic search.
download_url: "https://huggingface.co/gpustack/bge-m3-GGUF"

backend: llama
temp: 0
top_p: 1.0
top_k: 40
min_p: 0.01

llama:
  gguf: bge-m3-FP16.gguf
  context_size: 8192
  n_gpu_layers: -1
  jinja: true
  seed: 3407
  batch_size: 256
  ubatch_size: 256
