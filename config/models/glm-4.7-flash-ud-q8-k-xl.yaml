# Loaded when ACTIVE_MODEL=glm-4.7-flash-ud-q8-k-xl (in config/server.env). Same name as this file.
# Unsloth GLM-4.7-Flash UD-Q8_K_XL (best Q8; no Q7 in repo), ~35.6 GB. 30B-A3B MoE. Needs >32GB VRAM or will offload.
# Unsloth: repeat_penalty 1.0 (disable); temp 1.0 / top-p 0.95 (general); temp 0.7 / top-p 1.0 (tool-calling); min-p 0.01; jinja; ctx max 202752.
# llama.cpp: do not use --cache-reuse with this model. See KNOWN_ISSUES.md for other GLM + llama.cpp quirks.
gguf: GLM-4.7-Flash-UD-Q8_K_XL.gguf
download_url: "https://huggingface.co/unsloth/GLM-4.7-Flash-GGUF"

context_size: 0
n_gpu_layers: -1
threads: 28
jinja: true
# Tool-calling (Unsloth): temp 0.7, top_p 1.0
temp: 0.7
top_p: 1.0
# General use (Unsloth): temp 1.0, top_p 0.95
# temp: 1.0
# top_p: 0.95
top_k: 40
min_p: 0.01
repeat_penalty: 1.0
seed: 3407
# 35.6 GB model; use 4096 batch unless you have 48GB+ VRAM
batch_size: 4096
ubatch_size: 4096
# Proxy: only force tool_choice=required (avoid grammar trigger bug); loop limits off
proxy_force_tool_choice_required: true
proxy_loop_limits: false
# Optional: uncomment to try reducing CPU load when model is partly offloaded (see KNOWN_ISSUES.md)
# flash_attn: off
# cache_type_k: bf16
# cache_type_v: bf16
