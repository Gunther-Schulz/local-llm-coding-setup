# Loaded when ACTIVE_MODEL=glm-4.7-flash-ud-q8-k-xl (in config/server.env). Same name as this file.
# Unsloth GLM-4.7-Flash UD-Q8_K_XL (best Q8; no Q7 in repo), ~35.6 GB. 30B-A3B MoE. Needs >32GB VRAM or will offload.
# Unsloth: repeat_penalty 1.0 (disable); temp 1.0 / top-p 0.95 (general); temp 0.7 / top-p 1.0 (tool-calling); min-p 0.01; jinja; ctx max 202752.
# llama.cpp: do not use --cache-reuse with this model. See KNOWN_ISSUES.md for other GLM + llama.cpp quirks.
download_url: "https://huggingface.co/unsloth/GLM-4.7-Flash-GGUF"

backend: llama
temp: 0.7
top_p: 1.0
top_k: 40
min_p: 0.01

llama:
  gguf: GLM-4.7-Flash-UD-Q8_K_XL.gguf
  context_size: 0
  n_gpu_layers: -1
  jinja: true
  repeat_penalty: 1.0
  seed: 3407
  batch_size: 4096
  ubatch_size: 4096
