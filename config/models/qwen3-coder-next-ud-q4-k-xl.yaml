# Loaded when ACTIVE_MODEL=qwen3-coder-next-ud-q4-k-xl (in config/server.env). Same name as this file.
# Unsloth Dynamic Q4 K XL: ~48.5 GB single file. High-quality 4-bit; partial offload is automatic when model exceeds VRAM.
download_url: "https://huggingface.co/unsloth/Qwen3-Coder-Next-GGUF"

backend: llama
temp: 0
top_p: 0.95
top_k: 40
min_p: 0.01

llama:
  gguf: Qwen3-Coder-Next-UD-Q4_K_XL.gguf
  context_size: 131072
  n_gpu_layers: -1
  jinja: true
  seed: 3407
  batch_size: 8192
  ubatch_size: 8192
  chat_template_file: config/templates/Qwen3-Coder-tool-fix.jinja
