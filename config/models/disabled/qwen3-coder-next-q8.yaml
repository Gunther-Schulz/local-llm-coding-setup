# Loaded when ACTIVE_MODEL=qwen3-coder-next-q8 (in config/server.env). Same name as this file.
# Llama: UD-Q8_K_XL ~86 GB, 3 shards. vLLM: Qwen/Qwen3-Coder-Next safetensors.
backend: vllm
temp: 0
top_p: 0.95
top_k: 40
min_p: 0.01

llama:
  download_url: "https://huggingface.co/unsloth/Qwen3-Coder-Next-GGUF"
  gguf: UD-Q8_K_XL/Qwen3-Coder-Next-UD-Q8_K_XL-00001-of-00003.gguf
  context_size: 131072
  n_gpu_layers: -1
  jinja: true
  seed: 3407
  batch_size: 8192
  ubatch_size: 8192
  chat_template_file: config/templates/Qwen3-Coder-tool-fix.jinja

vllm:
  download_repo: "Qwen/Qwen3-Coder-Next"
  model: models/qwen3-coder-next-q8/vllm
  tool_call_parser: qwen3_coder
  max_model_len: 131072
  gpu_memory_utilization: 0.90
  tokenizer: Qwen/Qwen3-Coder-Next
  serve_extra: "--trust-remote-code"
