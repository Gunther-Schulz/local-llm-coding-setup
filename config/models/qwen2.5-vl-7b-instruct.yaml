# Loaded when ACTIVE_MODEL=qwen2.5-vl-7b-instruct (Mode 4: Code + Vision).
# Qwen 2.5 VL 7B Instruct — vision + text; charts, images, code. ~8 GB VRAM (Q4_K_M + mmproj).
# Requires: main GGUF + mmproj GGUF in models/qwen2.5-vl-7b-instruct/ (see download_url).
download_url: "https://huggingface.co/ggml-org/Qwen2.5-VL-7B-Instruct-GGUF"

backend: llama
temp: 0.7
top_p: 0.95
top_k: 40
min_p: 0.01

llama:
  gguf: Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf
  mmproj: mmproj-Qwen2.5-VL-7B-Instruct-Q8_0.gguf
  context_size: 32768
  n_gpu_layers: -1
  jinja: true
  seed: 3407
  batch_size: 512
  ubatch_size: 256
