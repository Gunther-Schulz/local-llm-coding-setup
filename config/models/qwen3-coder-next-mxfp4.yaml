# Loaded when ACTIVE_MODEL=qwen3-coder-next-mxfp4 (in config/server.env). Same name as this file.
# MXFP4_MOE, ~43.7 GB single file. Partial offload automatic when model exceeds VRAM.
download_url: "https://huggingface.co/unsloth/Qwen3-Coder-Next-GGUF"

backend: llama
temp: 1.0
top_p: 0.95
top_k: 40
min_p: 0.01

llama:
  gguf: Qwen3-Coder-Next-MXFP4_MOE.gguf
  context_size: 180000
  n_gpu_layers: -1
  jinja: true
  seed: 3407
  batch_size: 4096
  ubatch_size: 4096
  chat_template_file: config/templates/Qwen3-Coder-tool-fix.jinja
