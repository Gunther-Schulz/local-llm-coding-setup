# ACTIVE_MODEL=glm-4.7-flash-ud-q4-k-xl. Switch backend: llama (default) or vllm.
# Unsloth GLM-4.7-Flash UD-Q4_K_XL (best Q4), ~17.5 GB. 30B-A3B MoE. See KNOWN_ISSUES.md (llama.cpp).
download_url: "https://huggingface.co/unsloth/GLM-4.7-Flash-GGUF"

backend: llama

# Shared (both backends)
temp: 0.7
top_p: 1.0
top_k: 40
min_p: 0.01

llama:
  gguf: GLM-4.7-Flash-UD-Q4_K_XL.gguf
  context_size: 0
  n_gpu_layers: -1
  jinja: true
  seed: 3407
  batch_size: 4096
  ubatch_size: 4096
  chat_template_file: config/templates/GLM-4-tool.jinja

vllm:
  model: models/glm-4.7-flash-ud-q4-k-xl/GLM-4.7-Flash-UD-Q4_K_XL.gguf
  tool_call_parser: glm47
  max_model_len: 202752
  tokenizer: zai-org/GLM-4.7-Flash
