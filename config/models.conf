# LLM Models Configuration
# Format (10 cols required): model_key|display_name|gguf_path|tokenizer_id|max_context|tool_parser|tool_format|download_url|extended_context|recommended_use
# Optional proxy (cols 11–14, 1=on 0=off empty=use global): compression|virtual_tool|inject_system|inject_capability
# Optional llama-server (cols 15–17, empty=use config/llamacpp.env): fit_context|cache_type_k|moe_offload
#
# Proxy columns (config/settings.env): compression, virtual_tool, inject_system, inject_capability
# llama-server columns (config/llamacpp.env): fit_context (1/0/-), cache_type_k (e.g. q4_1), moe_offload (moe = full MoE to CPU, empty = none)
#
# tool_parser: llama.cpp / proxy tool parser (qwen3_coder, hermes, mistral, none)
# tool_format: Format model outputs tool calls in (qwen2.5, qwen3, none, auto)
# download_url: HuggingFace direct download URL (use 'none' if manual download only)
# extended_context: Max context when using --extended mode (with YaRN + CPU offload)
# compression: Cursor-style summarization + sliding window when over limit (1/0/empty)
# virtual_tool: Add search_compressed_conversation when stored (1/0/empty)
# inject_system: Inject config/system_message.txt (1/0/empty)
# inject_capability: Append capability reminder when tools present (1/0/empty)
# fit_context: 1 = --fit on, 0 = -c from context, empty = use global
# cache_type_k: e.g. q4_1 for KV cache; empty = use global
# moe_offload: moe = offload MoE experts to CPU (".ffn_.*_exps.=CPU"), empty = none

