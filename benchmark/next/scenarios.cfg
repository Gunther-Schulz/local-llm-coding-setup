# Qwen3-Coder-Next benchmark scenarios (+ GLM-4.7-Flash for comparison)
# Format: scenario_name|model_path|moe_ot_regex|cache_type_k|n_gpu_layers[|api_model]
# Optional api_model: model name for /v1/chat/completions (default qwen3-coder-next). Use for non-Qwen backends.
# n_gpu_layers: empty = all GPU (-1); 0 = all CPU; integer = that many layers; 25%/50%/75% = last that % of layers on GPU. BENCHMARK_N_LAYERS=80.
# GLM-4.7-Flash MXFP4_MOE (~17 GB, fits 5090 full GPU; 59.2% SWE-bench, 131K context)
glm47_mxfp4_full|models/glm-4.7-flash-mxfp4/GLM-4.7-Flash-MXFP4_MOE.gguf||||glm-4.7-flash
# Qwen3-Coder-30B-A3B Q4_K_XL full GPU – highest coding quality that fits entirely on GPU (~17 GB, 147K ctx, ~110–234 tok/s)
qwen30b_q4xl_full|models/qwen3-coder-30b-a3b-q4_k_xl/Qwen3-Coder-30B-A3B-Instruct-UD-Q4_K_XL.gguf||||qwen3-coder-30b-a3b
