# Tool Proxy Configuration
# Fully configurable reminder system with loop prevention

# Tool proxy settings (backend_url port must match config/server.env PORT)
proxy:
  port: 8010
  backend_url: http://localhost:8001

# Tool-specific reminders - messages injected when tools are called
tools:
  Read:
    enabled: false
    message: |
      REMINDER: Use Grep/Glob first for discovery. Read only after you know what file(s) to examine.
      If you've already read this file/range this turn, avoid redundant reads - consolidate or move on.
  
  Grep:
    enabled: false
    message: |
      REMINDER: Grep is for finding patterns across files. Use Glob to discover files first.
  
  Glob:
    enabled: false
    message: |
      REMINDER: Glob discovers files by pattern. Use Grep to search file contents.
  
  LS:
    enabled: false
    message: |
      REMINDER: LS lists directory contents. Use Glob for pattern-based file discovery.

# Read coalescing / deduplication settings (prevents same file/range loops)
read_coalescing:
  enabled: false
  max_reads_per_turn: 3
  reminder_message: |
    WARNING: This file/range has been read {count} times this turn.
    Avoid loops: Consolidate reads or use a different approach.
    If you need the full file, read it once and keep it in context.

# Overlapping range detection (optional, can catch redundant reads)
overlapping_ranges:
  enabled: false
  max_overlapping_reads: 2
  reminder_message: |
    WARNING: Multiple overlapping reads detected on this file.
    Consider reading the union range once instead of multiple partial reads.

# Turn tracking configuration
turn_tracking:
  enabled: false
  # How many turns to keep in memory (0 = infinite, but resets on server restart)
  max_turns_in_memory: 100
  # Clear turn state on turn boundary (auto-detected via turn_id)
  auto_reset_turn: true

# Logging configuration
logging:
  level: INFO   # DEBUG for request/response and interceptor detail
  # Set DEBUG=1 in env to force debug without editing config
  # Log file path (None for stdout only)
  file: null
  # Log tool calls (can be verbose, disable in production)
  log_tool_calls: false
  # Log reminders injected
  log_reminders: true
  # When true, log request path, body size, tool_calls, turn_id, backend response
  debug: false